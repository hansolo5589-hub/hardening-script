# 1. The Filter Table (Your Perimeter)
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state {established, related} accept
    iif lo accept
    tcp dport ssh accept
    pkttype host limit rate 5/second counter drop
    log prefix "GHOST_ALERT: " flags all
    counter drop
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}

# 2. The Mangle Table (Your Disguise)
table inet mangle {
  chain postrouting {
    type filter hook postrouting priority mangle;
    # Change TTL to 255 to mimic legacy Unix/Solaris
    ip ttl set 255
  }
}
